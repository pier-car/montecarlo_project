[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "nephele"
version = "0.1.0"
description = "Real-time Lagrangian stochastic CBRN dispersion modelling, data assimilation, and information-optimal sensor tasking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "NEPHELE contributors" }]
keywords = [
    "cbrn",
    "atmospheric-dispersion",
    "lagrangian-stochastic-model",
    "monte-carlo",
    "data-assimilation",
    "ensemble-kalman-filter",
    "sensor-placement",
    "submodular-optimization",
    "geospatial",
    "defence",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
service = ["fastapi>=0.110", "pydantic>=2.0", "uvicorn>=0.27"]
geo = ["GDAL>=3.4"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "mypy>=1.8", "ruff>=0.3"]

[project.urls]
Homepage = "https://github.com/pier-car/montecarlo_project"
Repository = "https://github.com/pier-car/montecarlo_project"

[tool.scikit-build]
wheel.packages = ["api/nephele"]
cmake.version = ">=3.18"
cmake.args = ["-DNEPHELE_BUILD_PYTHON=ON", "-DNEPHELE_BUILD_TESTS=OFF"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["api"]

[tool.ruff]
line-length = 90
src = ["api", "tests/python", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "B"]
"scripts/**" = ["ANN"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["api/nephele"]
